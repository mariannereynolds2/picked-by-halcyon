<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inbox | Picked by Halcyon</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css?v=1601e23dcfc0"></head><body><header class="topbar"><a class="brand" href="/"><span class="bookmark-mark"><span></span><span></span><span></span></span><span class="brandmark">Picked <em>by</em> Halcyon</span></a></header><main class="admin-shell"><p class="eyebrow">PRIVATE ADMIN INBOX</p><h1 class="display">What came in.</h1><p>This page loads saved newsletter signups, book submissions and contact messages from the admin-only API.</p><div class="admin-grid"><section class="admin-panel"><h2>Book submissions</h2><div data-admin-books>Loading…</div></section><section class="admin-panel"><h2>Contact messages</h2><div data-admin-messages>Loading…</div></section><section class="admin-panel"><h2>Newsletter</h2><div data-admin-newsletter>Loading…</div></section></div></main><script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
fetch("/api/admin-inbox").then(async r=>{if(!r.ok)throw new Error("Admin sign-in required");return r.json()}).then(d=>{
 const books=document.querySelector("[data-admin-books]"),msgs=document.querySelector("[data-admin-messages]"),news=document.querySelector("[data-admin-newsletter]");
 books.innerHTML=d.submissions.length?d.submissions.map(x=>`<article class="inbox-item"><strong>${esc(x.book_title)}</strong><p>${esc(x.author_name)} · ${esc(x.genre)}</p><p>${esc(x.email)}</p><p>${esc(x.why_fit)}</p><div class="inbox-meta">${new Date(x.created_at).toLocaleString()}</div></article>`).join(""):"No submissions yet.";
 msgs.innerHTML=d.messages.length?d.messages.map(x=>`<article class="inbox-item"><strong>${esc(x.subject||"Website message")}</strong><p>${esc(x.name)} · ${esc(x.email)}</p><p>${esc(x.message)}</p><div class="inbox-meta">${new Date(x.created_at).toLocaleString()}</div></article>`).join(""):"No messages yet.";
 news.innerHTML=d.newsletter.length?d.newsletter.map(x=>`<article class="inbox-item"><strong>${esc(x.email)}</strong><div class="inbox-meta">${new Date(x.created_at).toLocaleString()}</div></article>`).join(""):"No subscribers yet.";
}).catch(e=>{document.querySelectorAll(".admin-panel>div").forEach(el=>el.textContent=e.message)});
</script></body></html>
